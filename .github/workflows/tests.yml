name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agro_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agro_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_POSTGRES_TESTS: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: agro_platform
      PGADMIN_DATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      ARANET_API_KEY: ci-placeholder-not-a-real-key
      LOG_DIR: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=aranet_etl --cov-report=term-missing

